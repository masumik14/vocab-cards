<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            touch-action: manipulation;
            padding: 10px;
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* 管理用エリアは機能削減により削除 */

        .card {
            background-color: white;
            width: 90%;
            max-width: 500px;
            height: 350px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            user-select: none;
        }

        .card:active {
            transform: scale(0.98);
        }

        .label-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ecf0f1;
            color: #7f8c8d;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 右上スピーカーは廃止 */

        .card-content {
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
            line-height: 1.2;
        }

        .card-content.jp-text {
            font-size: 2rem;
        }

        .card-sub {
            /* 答えは少し大きめに */
            font-size: 1.9rem;
            line-height: 1.3;
            color: #e74c3c;
            min-height: 2.0em;
            font-weight: bold;
            width: 100%;
            word-break: break-word;
        }

        .hint {
            font-size: 1rem;
            color: #95a5a6;
            position: absolute;
            bottom: 20px;
        }

        .controls {
            width: 90%;
            max-width: 500px;
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 下部ナビのボタン幅/高さを揃える */
        .bottom-controls button {
            flex: 1 1 0;
        }

        button {
            padding: 0 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #2980b9;
        }

        button.secondary {
            background-color: #95a5a6;
        }


        .top-controls {
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-items: center;
            justify-items: center;
            /* center the control horizontally */
        }

        .rate-control {
            display: flex;
            align-items: center;
            justify-content: center;
            /* center items inside the pill */
            gap: 10px;
            font-size: 1.1rem;
            color: #666;
            background: #fff;
            padding: 0 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            min-width: 0;
            text-align: center;
            width: 100%;
            min-height: 56px;
            box-sizing: border-box;
            font-weight: bold;
        }

        .rate-control input[type="range"] {
            flex: 1 1 auto;
            min-width: 100px;
            max-width: 100%;
        }

        #rateValue {
            display: inline-block;
            width: 40px;
            text-align: left;
        }

        /* 読み上げボタンを上部のピルと統一 */
        .speak-button {
            width: 100%;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #fff;
            color: #3498db;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            padding: 0 20px;
            box-sizing: border-box;
        }

        .speak-button:hover {
            background: #f7fafc;
        }

        /* トップエリアは速度設定のみ */

        /* Small screens: stack neatly */
        @media (max-width: 420px) {
            .top-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="controls top-controls">
        <label class="rate-control">
            Speed
            <input type="range" min="0.6" max="1.0" step="0.05" value="0.8" oninput="setSpeechRate(this.value)">
            <span id="rateValue">0.8</span>
        </label>
        <button class="speak-button" onclick="playAudio()">🔊 読み上げ</button>
    </div>

    <div class="card" onclick="flipCard()">
        <div class="label-badge" id="typeLabel">問題</div>
        <div class="card-content" id="question">Loading...</div>
        <div class="card-sub" id="answer"></div>
        <div class="hint">タップして答えを見る</div>
    </div>

    <div class="controls bottom-controls">
        <button class="secondary" onclick="prevCard()">戻る</button>
        <button onclick="nextCard()">次へ</button>
    </div>

    <script>
        // ★★★ デフォルトデータ（ファイル読み込みがない場合に表示） ★★★
        const defaultData = [
            { en: "ran", jp: "run（走る）の過去形", startMode: "jp" },
            { en: "relay", jp: "リレー競走", startMode: "en" },
            { en: "runner", jp: "走者", startMode: "jp" },
            { en: "won", jp: "win（勝つ）の過去形", startMode: "en" },
            { en: "anything", jp: "[否定文で] 何も（…ない）", startMode: "jp" },
            { en: "ask(ed)", jp: "…を［に］たずねる，質問する", startMode: "jp" },
            { en: "away", jp: "はなれて，去って", startMode: "en" },
            { en: "became", jp: "become（…になる）の過去形", startMode: "en" },
            { en: "become", jp: "…になる", startMode: "jp" },
            { en: "blind", jp: "目の不自由な", startMode: "jp" },
            { en: "bought", jp: "buy（買う）の過去形", startMode: "en" },
            { en: "could", jp: "can（…できる）の過去形", startMode: "jp" },
            { en: "dollar(s)", jp: "ドル", startMode: "en" },
        ];

        let currentList = [...defaultData];
        let currentIndex = 0;
        let isShowingAnswer = false;



        // 読み上げ速度（スライダーで変更）
        let speechRate = 0.8;
        function setSpeechRate(v) {
            speechRate = Number(v);
            const el = document.getElementById('rateValue');
            if (el) el.textContent = v;
        }
        // 出題方向は単語ごとのstartModeに従う（機能簡素化）

        function updateDisplay() {
            if (currentList.length === 0) return;

            const item = currentList[currentIndex];
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const labelEl = document.getElementById('typeLabel');

            let questionText = "";
            let answerText = "";
            let isJpQuestion = false;

            // 出題方向を決定（単語ごとのstartModeのみ）
            let mode = (item.startMode === 'jp') ? 'ja2en' : 'en2ja';

            if (mode === 'ja2en') {
                questionText = item.jp;
                answerText = item.en;
                isJpQuestion = true;
                labelEl.textContent = "日本語 → 英語";
            } else {
                questionText = item.en;
                answerText = item.jp;
                isJpQuestion = false;
                labelEl.textContent = "英語 → 日本語";
            }

            qEl.textContent = questionText;
            if (isJpQuestion) {
                qEl.classList.add("jp-text");
            } else {
                qEl.classList.remove("jp-text");
            }
            aEl.textContent = isShowingAnswer ? answerText : "";
        }

        function flipCard() {
            isShowingAnswer = !isShowingAnswer;
            updateDisplay();
        }

        function nextCard() {
            isShowingAnswer = false;
            currentIndex++;
            if (currentIndex >= currentList.length) {
                currentIndex = 0;
            }
            updateDisplay();
        }

        function prevCard() {
            isShowingAnswer = false;
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = currentList.length - 1;
            }
            updateDisplay();
        }

        function resetCard() {
            isShowingAnswer = false;
            updateDisplay();
        }


        let speechPrimed = false;

        function primeSpeechOnce() {
            // iPad/iPhone等で「最初の1回だけ無音」になりがちな挙動を避けるための最小prime
            if (speechPrimed) return false;
            speechPrimed = true;

            try {
                // まずキューをクリアしてから、極短い発話を1回だけ流してエンジンを起動させる
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(' ');
                u.lang = 'en-US';
                u.rate = 0.9;
                speechSynthesis.speak(u);
            } catch (e) {
                // speechSynthesis未対応/利用不可の環境では何もしない
            }
            return true;
        }

        function playAudio(event) {
            // カード上/外部ボタン両対応
            if (event && event.stopPropagation) event.stopPropagation();

            if (currentList.length === 0) return;
            const item = currentList[currentIndex];
            const rawText = (item.en || "").trim();

            if (!rawText) return;

            // ★最小prime（最初の1回だけ）
            const didPrime = primeSpeechOnce();

            // 2回目以降は、連打対策としてキューをクリア
            if (!didPrime) {
                speechSynthesis.cancel();
            }

            // 括弧の有無に応じて読み上げテキストを用意
            const hasParen = /[()]/.test(rawText);
            const baseText = rawText
                .replace(/\([^)]*\)/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            const fullText = rawText
                .replace(/[()]/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();

            // 音声設定を適用して発話を作るヘルパー
            const makeUtterance = (t) => {
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US';
                u.rate = speechRate;
                const voices = speechSynthesis.getVoices();
                const enVoice = voices.find(v => v.lang === 'en-US');
                if (enVoice) u.voice = enVoice;
                return u;
            };

            // セッションIDで連打時のぶら下がりを防ぐ
            if (!window.__speakSessionId) window.__speakSessionId = 0;
            const sessionId = ++window.__speakSessionId;

            const speakFull = () => {
                if (window.__speakSessionId !== sessionId) return;
                if (!fullText) return;
                const u2 = makeUtterance(fullText);
                speechSynthesis.speak(u2);
            };

            if (hasParen && baseText && baseText !== fullText) {
                const u1 = makeUtterance(baseText);
                u1.onend = () => {
                    if (window.__speakSessionId !== sessionId) return;
                    setTimeout(speakFull, 1000);
                };
                speechSynthesis.speak(u1);
            } else {
                // 括弧なし、または有効な基底形が作れない場合は通常読み上げ
                const u = makeUtterance(fullText || rawText);
                speechSynthesis.speak(u);
            }
        }


        // 初期表示
        updateDisplay();
    </script>
</body>

</html>
