<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            touch-action: manipulation;
            padding: 10px;
        }

        /* 管理用エリア（CSV読み込みなど） */
        .admin-area {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #fff;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #666;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        input[type="file"] {
            margin-top: 5px;
            max-width: 100%;
        }

        .card {
            background-color: white;
            width: 90%;
            max-width: 500px;
            height: 350px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            user-select: none;
        }

        .card:active {
            transform: scale(0.98);
        }

        .label-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ecf0f1;
            color: #7f8c8d;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .speaker-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #3498db;
            background: #eaf6ff;
            width: 50px;
            height: 50px;
            line-height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
        }

        .speaker-icon:hover {
            background: #d0e9ff;
        }

        .card-content {
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
            line-height: 1.2;
        }

        .card-content.jp-text {
            font-size: 2rem;
        }

        .card-sub {
            font-size: 1.6rem;
            color: #e74c3c;
            min-height: 1.5em;
            font-weight: bold;
            width: 100%;
        }

        .hint {
            font-size: 1rem;
            color: #95a5a6;
            position: absolute;
            bottom: 20px;
        }

        .controls {
            width: 90%;
            max-width: 500px;
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background-color: #2980b9;
        }

        button.secondary {
            background-color: #95a5a6;
        }


        .top-controls {
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
        }

        .rate-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #666;
            background: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            min-width: 0;
            /* allow shrink within grid */
        }

        .rate-control input[type="range"] {
            width: 180px;
            max-width: 100%;
        }

        /* Top buttons: consistent height */
        .top-controls button {
            height: 44px;
            padding: 0 22px;
            white-space: nowrap;
        }

        /* Small screens: stack neatly */
        @media (max-width: 420px) {
            .top-controls {
                grid-template-columns: 1fr 1fr;
            }

            .top-controls .rate-control {
                grid-column: 1 / -1;
            }

            .top-controls button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="admin-area">
        <label for="csvFile">📂 別の単語リスト(CSV)を読み込む</label><br>
        <input type="file" id="csvFile" accept=".csv" onchange="loadCSV(this)">
    </div>


    <div class="controls top-controls">
        <label class="rate-control">
            Speed
            <input type="range" min="0.6" max="1.0" step="0.05" value="0.8" oninput="setSpeechRate(this.value)">
            <span id="rateValue">0.8</span>
        </label>
        <button class="secondary" onclick="shuffleCards()">シャッフル</button>
        <button class="secondary" onclick="toggleQuizMode()">出題反転</button>
    </div>

    <div class="card" onclick="flipCard()">
        <div class="label-badge" id="typeLabel">問題</div>
        <div class="speaker-icon" onclick="playAudio(event)">🔊</div>
        <div class="card-content" id="question">Loading...</div>
        <div class="card-sub" id="answer"></div>
        <div class="hint">タップして答えを見る</div>
    </div>

    <div class="controls">
        <button class="secondary" onclick="prevCard()">戻る</button>
        <button onclick="nextCard()">次へ (Next)</button>
    </div>

    <script>
        // ★★★ デフォルトデータ（ファイル読み込みがない場合に表示） ★★★
    const defaultData = [
        { en: "ran", jp: "run（走る）の過去形", startMode: "jp" },
        { en: "relay", jp: "リレー競走", startMode: "en" },
        { en: "runner", jp: "走者", startMode: "jp" },
        { en: "won", jp: "win（勝つ）の過去形", startMode: "en" },
        { en: "anything", jp: "[否定文で] 何も（…ない）", startMode: "jp" },
        { en: "ask(ed)", jp: "…を［に］たずねる，質問する", startMode: "jp" },
        { en: "away", jp: "はなれて，去って", startMode: "en" },
        { en: "became", jp: "become（…になる）の過去形", startMode: "en" },
        { en: "become", jp: "…になる", startMode: "jp" },
        { en: "blind", jp: "目の不自由な", startMode: "jp" },
        { en: "bought", jp: "buy（買う）の過去形", startMode: "en" },
        { en: "could", jp: "can（…できる）の過去形", startMode: "jp" },
        { en: "dollar(s)", jp: "ドル", startMode: "en" },
    ];

        let currentList = [...defaultData];
        let currentIndex = 0;
        let isShowingAnswer = false;



        // 読み上げ速度（スライダーで変更）
        let speechRate = 0.8;
        function setSpeechRate(v) {
            speechRate = Number(v);
            const el = document.getElementById('rateValue');
            if (el) el.textContent = v;
        }
        // 出題方向（auto=単語ごとのstartMode、en2ja=英→日固定、ja2en=日→英固定）
        let quizMode = 'auto';
        // --- CSV読み込み処理 ---
        function loadCSV(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                parseCSV(text);
            };
            reader.readAsText(file);
        }

        function parseCSV(text) {
            const newData = [];
            const lines = text.split(/\r\n|\n/);

            lines.forEach(line => {
                if (!line.trim()) return;
                const cols = line.split(',');
                if (cols.length >= 2) {
                    newData.push({
                        en: cols[0].trim(),
                        jp: cols[1].trim(),
                        startMode: (cols[2] && cols[2].trim() === 'en') ? 'en' : 'jp'
                    });
                }
            });

            if (newData.length > 0) {
                currentList = [...newData];
                currentIndex = 0;
                resetCard();
                // 読み込み完了メッセージ
                alert(`CSVファイルを読み込みました！\n全${newData.length}単語に切り替わります。`);
                // 入力をクリア（同じファイルを再読み込みできるように）
                document.getElementById('csvFile').value = "";
            } else {
                alert("うまく読み込めませんでした。CSVの中身を確認してください。");
            }
        }
        // -----------------------

        function updateDisplay() {
            if (currentList.length === 0) return;

            const item = currentList[currentIndex];
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const labelEl = document.getElementById('typeLabel');

            let questionText = "";
            let answerText = "";
            let isJpQuestion = false;

            // 出題方向を決定（quizModeがautoの場合のみ、単語ごとのstartModeを使う）
            let mode = quizMode;
            if (mode === 'auto') {
                mode = (item.startMode === 'jp') ? 'ja2en' : 'en2ja';
            }

            if (mode === 'ja2en') {
                questionText = item.jp;
                answerText = item.en;
                isJpQuestion = true;
                labelEl.textContent = "日本語 → 英語";
            } else {
                questionText = item.en;
                answerText = item.jp;
                isJpQuestion = false;
                labelEl.textContent = "英語 → 日本語";
            }

            qEl.textContent = questionText;
            if (isJpQuestion) {
                qEl.classList.add("jp-text");
            } else {
                qEl.classList.remove("jp-text");
            }
            aEl.textContent = isShowingAnswer ? answerText : "";
        }

        function flipCard() {
            isShowingAnswer = !isShowingAnswer;
            updateDisplay();
        }

        function nextCard() {
            isShowingAnswer = false;
            currentIndex++;
            if (currentIndex >= currentList.length) {
                currentIndex = 0;
            }
            updateDisplay();
        }

        function prevCard() {
            isShowingAnswer = false;
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = currentList.length - 1;
            }
            updateDisplay();
        }


        function shuffleCards() {
            for (let i = currentList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
            }
            currentIndex = 0;
            resetCard();
            alert("シャッフルしました！");
        }

        function resetCard() {
            isShowingAnswer = false;
            updateDisplay();
        }


        function toggleQuizMode() {
            // auto → (現状に合わせて反転) → 以後は固定方向で反転
            isShowingAnswer = false;

            if (quizMode === 'auto') {
                const item = currentList[currentIndex];
                const current = (item && item.startMode === 'jp') ? 'ja2en' : 'en2ja';
                quizMode = (current === 'ja2en') ? 'en2ja' : 'ja2en';
            } else {
                quizMode = (quizMode === 'ja2en') ? 'en2ja' : 'ja2en';
            }
            updateDisplay();
        }

        let speechPrimed = false;

        function primeSpeechOnce() {
            // iPad/iPhone等で「最初の1回だけ無音」になりがちな挙動を避けるための最小prime
            if (speechPrimed) return false;
            speechPrimed = true;

            try {
                // まずキューをクリアしてから、極短い発話を1回だけ流してエンジンを起動させる
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(' ');
                u.lang = 'en-US';
                u.rate = 0.9;
                speechSynthesis.speak(u);
            } catch (e) {
                // speechSynthesis未対応/利用不可の環境では何もしない
            }
            return true;
        }

        function playAudio(event) {
            event.stopPropagation(); // カードが裏返るのを防ぐ

            if (currentList.length === 0) return;
            const item = currentList[currentIndex];
            const rawText = (item.en || "").trim();

            if (!rawText) return;

            // ★最小prime（最初の1回だけ）
            const didPrime = primeSpeechOnce();

            // 2回目以降は、連打対策としてキューをクリア
            if (!didPrime) {
                speechSynthesis.cancel();
            }

            // 括弧の有無に応じて読み上げテキストを用意
            const hasParen = /[()]/.test(rawText);
            const baseText = rawText
                .replace(/\([^)]*\)/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            const fullText = rawText
                .replace(/[()]/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();

            // 音声設定を適用して発話を作るヘルパー
            const makeUtterance = (t) => {
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US';
                u.rate = speechRate;
                const voices = speechSynthesis.getVoices();
                const enVoice = voices.find(v => v.lang === 'en-US');
                if (enVoice) u.voice = enVoice;
                return u;
            };

            // セッションIDで連打時のぶら下がりを防ぐ
            if (!window.__speakSessionId) window.__speakSessionId = 0;
            const sessionId = ++window.__speakSessionId;

            const speakFull = () => {
                if (window.__speakSessionId !== sessionId) return;
                if (!fullText) return;
                const u2 = makeUtterance(fullText);
                speechSynthesis.speak(u2);
            };

            if (hasParen && baseText && baseText !== fullText) {
                const u1 = makeUtterance(baseText);
                u1.onend = () => {
                    if (window.__speakSessionId !== sessionId) return;
                    setTimeout(speakFull, 1000);
                };
                speechSynthesis.speak(u1);
            } else {
                // 括弧なし、または有効な基底形が作れない場合は通常読み上げ
                const u = makeUtterance(fullText || rawText);
                speechSynthesis.speak(u);
            }
        }


        // 初期表示
        updateDisplay();
    </script>
</body>

</html>
