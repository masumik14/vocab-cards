<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳</title>
    <meta name="theme-color" content="#f0f4f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="単語帳">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            touch-action: manipulation;
            padding: 10px;
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .card-wrapper {
            width: 90%;
            max-width: 500px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: clamp(360px, 58svh, 430px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            text-align: center;
            padding: 22px;
            transition: box-shadow 0.2s;
            user-select: none;
        }

        .card-wrapper:hover .card {
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
        }

        .label-badge {
            flex: 0 0 auto;
            align-self: flex-start;
            background: #ecf0f1;
            color: #7f8c8d;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .question-panel {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-content {
            font-size: 2.8rem;
            font-weight: bold;
            width: 100%;
            line-height: 1.2;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .card-content.jp-text {
            font-size: 2rem;
        }

        .answer-panel {
            flex: 0 0 126px;
            border-top: 1px solid #ecf0f1;
            margin-top: 24px;
            padding-top: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
        }

        .card-sub {
            font-size: 1.9rem;
            line-height: 1.3;
            color: #e74c3c;
            font-weight: bold;
            width: 100%;
            word-break: break-word;
            overflow-wrap: anywhere;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .hint {
            font-size: 0.95rem;
            color: #b2bec3;
            pointer-events: none;
            transition: opacity 0.22s ease;
        }

        .card.answer-visible .card-sub {
            opacity: 1;
            transform: translateY(0);
        }

        .progress {
            font-size: 0.9rem;
            color: #aaa;
            margin: 0 0 8px;
            letter-spacing: 0.05em;
        }

        .controls {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 0 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: background-color 0.15s;
        }

        button.secondary {
            background-color: transparent;
            color: #95a5a6;
            border: 2px solid #d5d8dc;
            font-weight: normal;
        }

        @media (hover: hover) {
            button:hover {
                background-color: #2980b9;
            }
            button.secondary:hover {
                background-color: #f2f3f4;
            }
        }

        .speak-controls {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            margin-bottom: 10px;
            background: #f0f7ff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            padding: 8px 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .speak-controls .btn-speak {
            background: #d6eaf8;
            color: #2980b9;
            border: none;
            box-shadow: none;
            font-weight: bold;
            width: 100%;
            border-radius: 10px;
        }

        .speak-controls .btn-speak:focus {
            outline: none;
        }

        @media (hover: hover) {
            .speak-controls .btn-speak:hover {
                background: #aed6f1;
            }
        }

        .bottom-controls {
            align-items: center;
            margin-top: 0;
        }

        .bottom-controls .btn-prev {
            flex: 1 1 0;
        }

        .bottom-controls .btn-next {
            flex: 1 1 0;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .speed-control input[type="range"] {
            width: 120px;
            accent-color: #3498db;
        }

        #rateValue {
            display: inline-block;
            width: 28px;
            text-align: left;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="progress" id="progress"></div>

    <div class="card-wrapper" onclick="flipCard()">
        <div class="card" id="card">
            <div class="label-badge" id="typeLabel"></div>
            <div class="question-panel">
                <div class="card-content" id="question">Loading...</div>
            </div>
            <div class="answer-panel">
                <div class="card-sub" id="answer"></div>
                <div class="hint" id="hint">タップして答えを見る</div>
            </div>
        </div>
    </div>

    <div class="speak-controls">
        <button class="btn-speak" onclick="playAudio(event)">🔊 読み上げ</button>
        <div class="speed-control">
            Speed
            <input type="range" min="0.6" max="1.0" step="0.05" value="0.8" oninput="setSpeechRate(this.value)">
            <span id="rateValue">0.8</span>
        </div>
    </div>

    <div class="controls bottom-controls">
        <button class="secondary btn-prev" onclick="prevCard()">← 戻る</button>
        <button class="btn-next" onclick="nextCard()">次へ →</button>
    </div>

    <script>
        let currentList = [];
        let currentIndex = 0;
        let isShowingAnswer = false;

        function parseCsvLine(line) {
            const fields = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    fields.push(field.trim());
                    field = "";
                } else {
                    field += char;
                }
            }

            if (inQuotes) return null;
            fields.push(field.trim());
            if (fields.length < 3) return null;

            const rawStartMode = fields.pop().toLowerCase();
            const jp = fields.pop();
            const en = fields.join(", ");
            const startMode = (rawStartMode === "ja")
                ? "ja"
                : (rawStartMode === "en" ? "en" : "");

            if (!en || !jp || !startMode) return null;

            return { en, jp, startMode };
        }

        function showEmptyState(title = "単語データがありません", detail = "words.csv を確認してください") {
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const labelEl = document.getElementById('typeLabel');
            const cardEl = document.getElementById('card');
            const hintEl = document.getElementById('hint');

            qEl.textContent = title;
            qEl.classList.add("jp-text");
            aEl.textContent = detail;
            labelEl.textContent = "読込エラー";
            if (cardEl) cardEl.classList.add('answer-visible');
            if (hintEl) hintEl.textContent = "";
        }

        async function loadWordList() {
            const csvUrl = "./words.csv?v=" + Date.now();

            currentList = [];
            currentIndex = 0;
            isShowingAnswer = false;

            if (window.location.protocol === "file:") {
                showEmptyState("ローカル直開きでは読めません", "GitHub Pages かローカルサーバで開いてください");
                return;
            }

            try {
                const response = await fetch(csvUrl, { cache: "no-store" });

                if (!response.ok) {
                    throw new Error("Failed to load CSV: " + response.status);
                }

                const text = await response.text();
                const lines = text
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(Boolean);

                const hasHeader = lines.length > 0 && lines[0].toLowerCase() === "en,jp,startmode";
                const dataLines = hasHeader ? lines.slice(1) : lines;
                const invalidLines = [];
                const parsedRows = [];

                dataLines.forEach((line, index) => {
                    const row = parseCsvLine(line);
                    if (row) {
                        parsedRows.push(row);
                    } else {
                        invalidLines.push(index + (hasHeader ? 2 : 1));
                    }
                });

                if (parsedRows.length === 0) {
                    showEmptyState("CSVに単語データがありません", "ヘッダの下にデータを入れてください");
                    return;
                }

                if (invalidLines.length > 0) {
                    showEmptyState("CSV形式エラーがあります", invalidLines.join(', ') + "行目を確認してください");
                    return;
                }

                currentList = parsedRows;
            } catch (error) {
                console.warn("CSV load failed.", error);
                showEmptyState("単語データを読めませんでした", "words.csv を確認してください");
                return;
            }

            updateDisplay();
        }

        let speechRate = 0.8;
        function setSpeechRate(v) {
            speechRate = Number(v);
            const el = document.getElementById('rateValue');
            if (el) el.textContent = v;
        }

        function fitTextToBox(textEl, boxEl, maxRem, minRem, availableHeight) {
            if (!textEl || !boxEl) return;

            const rootFontSize = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
            let sizePx = maxRem * rootFontSize;
            const minPx = minRem * rootFontSize;
            const maxHeight = availableHeight || boxEl.clientHeight;

            textEl.style.fontSize = `${sizePx}px`;

            while (
                sizePx > minPx
                && (textEl.scrollHeight > maxHeight || textEl.scrollWidth > boxEl.clientWidth)
            ) {
                sizePx -= 1;
                textEl.style.fontSize = `${sizePx}px`;
            }
        }

        function fitCardText() {
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const qBoxEl = document.querySelector('.question-panel');
            const aBoxEl = document.querySelector('.answer-panel');
            const hintEl = document.getElementById('hint');
            const answerHeight = aBoxEl
                ? Math.max(48, aBoxEl.clientHeight - (hintEl ? hintEl.offsetHeight : 0) - 16)
                : undefined;

            fitTextToBox(qEl, qBoxEl, qEl && qEl.classList.contains('jp-text') ? 2 : 2.8, 1.35);
            fitTextToBox(aEl, aBoxEl, 1.9, 1.15, answerHeight);
        }

        function updateDisplay() {
            if (currentList.length === 0) {
                showEmptyState();
                return;
            }

            const item = currentList[currentIndex];
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const labelEl = document.getElementById('typeLabel');
            const cardEl = document.getElementById('card');
            const hintEl = document.getElementById('hint');

            let questionText = "";
            let answerText = "";
            let isJpQuestion = false;
            let mode = (item.startMode === 'ja') ? 'ja2en' : 'en2ja';
            let labelText = "";

            if (mode === 'ja2en') {
                questionText = item.jp;
                answerText = item.en;
                isJpQuestion = true;
                labelText = "日本語 → 英語";
            } else {
                questionText = item.en;
                answerText = item.jp;
                isJpQuestion = false;
                labelText = "英語 → 日本語";
            }

            labelEl.textContent = labelText;

            qEl.textContent = questionText;
            if (isJpQuestion) {
                qEl.classList.add("jp-text");
            } else {
                qEl.classList.remove("jp-text");
            }

            aEl.textContent = answerText;

            const progressEl = document.getElementById('progress');
            if (progressEl) progressEl.textContent = `${currentIndex + 1} / ${currentList.length}`;

            cardEl.classList.remove('answer-visible');
            if (hintEl) hintEl.textContent = "タップして答えを見る";
            isShowingAnswer = false;
            requestAnimationFrame(fitCardText);
        }

        function flipCard() {
            isShowingAnswer = !isShowingAnswer;
            const cardEl = document.getElementById('card');
            const hintEl = document.getElementById('hint');
            cardEl.classList.toggle('answer-visible', isShowingAnswer);
            if (hintEl) hintEl.textContent = isShowingAnswer ? "タップして答えを隠す" : "タップして答えを見る";
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex >= currentList.length) {
                currentIndex = 0;
            }
            updateDisplay();
        }

        function prevCard() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = currentList.length - 1;
            }
            updateDisplay();
        }

        let speechPrimed = false;

        function primeSpeechOnce() {
            if (speechPrimed) return false;
            speechPrimed = true;

            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(' ');
                u.lang = 'en-US';
                u.rate = 0.9;
                speechSynthesis.speak(u);
            } catch (e) {
            }
            return true;
        }

        function playAudio(event) {
            if (event && event.stopPropagation) event.stopPropagation();
            if (event && event.currentTarget) event.currentTarget.blur();

            if (currentList.length === 0) {
                showEmptyState();
                return;
            }
            const item = currentList[currentIndex];
            const rawText = (item.en || "").trim();

            if (!rawText) return;

            const didPrime = primeSpeechOnce();

            if (!didPrime) {
                speechSynthesis.cancel();
            }

            const formatSpeechText = (text) => text
                .replace(/\s*[-;]\s*/g, ', ')
                .replace(/\s{2,}/g, ' ')
                .trim();

            const hasParen = /[()]/.test(rawText);
            const baseText = formatSpeechText(rawText
                .replace(/\([^)]*\)/g, '')
            );
            const fullText = formatSpeechText(rawText
                .replace(/[()]/g, '')
            );

            const makeUtterance = (t) => {
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US';
                u.rate = speechRate;
                const voices = speechSynthesis.getVoices();
                const enVoice = voices.find(v => v.lang === 'en-US');
                if (enVoice) u.voice = enVoice;
                return u;
            };

            if (!window.__speakSessionId) window.__speakSessionId = 0;
            const sessionId = ++window.__speakSessionId;

            const speakFull = () => {
                if (window.__speakSessionId !== sessionId) return;
                if (!fullText) return;
                const u2 = makeUtterance(fullText);
                speechSynthesis.speak(u2);
            };

            if (hasParen && baseText && baseText !== fullText) {
                const u1 = makeUtterance(baseText);
                u1.onend = () => {
                    if (window.__speakSessionId !== sessionId) return;
                    setTimeout(speakFull, 1000);
                };
                speechSynthesis.speak(u1);
            } else {
                const u = makeUtterance(fullText || rawText);
                speechSynthesis.speak(u);
            }
        }

        loadWordList();
        window.addEventListener('resize', fitCardText);
    </script>

</body>

</html>
