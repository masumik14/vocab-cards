<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語帳</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            touch-action: manipulation;
            padding: 10px;
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .card-wrapper {
            width: 90%;
            max-width: 500px;
            height: 350px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            user-select: none;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: box-shadow 0.2s;
        }

        .card-wrapper:hover .card-face {
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .label-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ecf0f1;
            color: #7f8c8d;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card-content {
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
            line-height: 1.2;
        }

        .card-content.jp-text {
            font-size: 2rem;
        }

        .card-sub {
            font-size: 1.9rem;
            line-height: 1.3;
            color: #e74c3c;
            font-weight: bold;
            width: 100%;
            word-break: break-word;
        }

        .hint {
            font-size: 0.95rem;
            color: #b2bec3;
            position: absolute;
            bottom: 20px;
            pointer-events: none;
        }

        .progress {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 12px;
            letter-spacing: 0.05em;
        }

        .controls {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 0 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: background-color 0.15s;
        }

        button.secondary {
            background-color: transparent;
            color: #95a5a6;
            border: 2px solid #d5d8dc;
            font-weight: normal;
        }

        @media (hover: hover) {
            button:hover {
                background-color: #2980b9;
            }
            button.secondary:hover {
                background-color: #f2f3f4;
            }
        }

        .speak-controls {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            margin-bottom: 10px;
            background: #f0f7ff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            padding: 8px 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .speak-controls .btn-speak {
            background: #d6eaf8;
            color: #2980b9;
            border: none;
            box-shadow: none;
            font-weight: bold;
            width: 100%;
            border-radius: 10px;
        }

        .speak-controls .btn-speak:focus {
            outline: none;
        }

        @media (hover: hover) {
            .speak-controls .btn-speak:hover {
                background: #aed6f1;
            }
        }

        .bottom-controls {
            align-items: center;
            margin-top: 0;
        }

        .bottom-controls .btn-prev {
            flex: 1 1 0;
        }

        .bottom-controls .btn-next {
            flex: 1 1 0;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .speed-control input[type="range"] {
            width: 120px;
            accent-color: #3498db;
        }

        #rateValue {
            display: inline-block;
            width: 28px;
            text-align: left;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="progress" id="progress"></div>

    <div class="card-wrapper" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="label-badge" id="typeLabel"></div>
                <div class="card-content" id="question">Loading...</div>
                <div class="hint">タップして答えを見る</div>
            </div>
            <div class="card-face card-back">
                <div class="label-badge" id="typeLabelBack"></div>
                <div class="card-sub" id="answer"></div>
            </div>
        </div>
    </div>

    <div class="speak-controls">
        <button class="btn-speak" onclick="playAudio(event)">🔊 読み上げ</button>
        <div class="speed-control">
            Speed
            <input type="range" min="0.6" max="1.0" step="0.05" value="0.8" oninput="setSpeechRate(this.value)">
            <span id="rateValue">0.8</span>
        </div>
    </div>

    <div class="controls bottom-controls">
        <button class="secondary btn-prev" onclick="prevCard()">← 戻る</button>
        <button class="btn-next" onclick="nextCard()">次へ →</button>
    </div>

    <script>
        let currentList = [];
        let currentIndex = 0;
        let isShowingAnswer = false;

        function parseCsvLine(line) {
            const match = line.match(/^([^,]+),"(.*)",([^,]+)$/);
            if (!match) return null;

            const en = match[1].trim();
            const jp = match[2].trim().replace(/""/g, '"');
            const rawStartMode = match[3].trim().toLowerCase();
            const startMode = (rawStartMode === "ja")
                ? "ja"
                : (rawStartMode === "en" ? "en" : "");

            if (!en || !jp || !startMode) return null;

            return { en, jp, startMode };
        }

        function showEmptyState(title = "単語データがありません", detail = "words.csv を確認してください") {
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const labelEl = document.getElementById('typeLabel');
            const labelBackEl = document.getElementById('typeLabelBack');

            qEl.textContent = title;
            qEl.classList.add("jp-text");
            aEl.textContent = detail;
            labelEl.textContent = "読込エラー";
            if (labelBackEl) labelBackEl.textContent = "読込エラー";
        }

        async function loadWordList() {
            const csvUrl = "./words.csv?v=" + Date.now();

            currentList = [];
            currentIndex = 0;
            isShowingAnswer = false;

            if (window.location.protocol === "file:") {
                showEmptyState("ローカル直開きでは読めません", "GitHub Pages かローカルサーバで開いてください");
                return;
            }

            try {
                const response = await fetch(csvUrl, { cache: "no-store" });

                if (!response.ok) {
                    throw new Error("Failed to load CSV: " + response.status);
                }

                const text = await response.text();
                const lines = text
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(Boolean);

                const hasHeader = lines.length > 0 && lines[0].toLowerCase() === "en,jp,startmode";
                const dataLines = hasHeader ? lines.slice(1) : lines;
                const invalidLines = [];
                const parsedRows = [];

                dataLines.forEach((line, index) => {
                    const row = parseCsvLine(line);
                    if (row) {
                        parsedRows.push(row);
                    } else {
                        invalidLines.push(index + (hasHeader ? 2 : 1));
                    }
                });

                if (parsedRows.length === 0) {
                    showEmptyState("CSVに単語データがありません", "ヘッダの下にデータを入れてください");
                    return;
                }

                if (invalidLines.length > 0) {
                    showEmptyState("CSV形式エラーがあります", invalidLines.join(', ') + "行目を確認してください");
                    return;
                }

                currentList = parsedRows;
            } catch (error) {
                console.warn("CSV load failed.", error);
                showEmptyState("単語データを読めませんでした", "words.csv を確認してください");
                return;
            }

            updateDisplay();
        }

        let speechRate = 0.8;
        function setSpeechRate(v) {
            speechRate = Number(v);
            const el = document.getElementById('rateValue');
            if (el) el.textContent = v;
        }

        function updateDisplay() {
            if (currentList.length === 0) {
                showEmptyState();
                return;
            }

            const item = currentList[currentIndex];
            const qEl = document.getElementById('question');
            const aEl = document.getElementById('answer');
            const labelEl = document.getElementById('typeLabel');
            const labelBackEl = document.getElementById('typeLabelBack');
            const cardEl = document.getElementById('card');

            let questionText = "";
            let answerText = "";
            let isJpQuestion = false;
            let mode = (item.startMode === 'ja') ? 'ja2en' : 'en2ja';
            let labelText = "";

            if (mode === 'ja2en') {
                questionText = item.jp;
                answerText = item.en;
                isJpQuestion = true;
                labelText = "日本語 → 英語";
            } else {
                questionText = item.en;
                answerText = item.jp;
                isJpQuestion = false;
                labelText = "英語 → 日本語";
            }

            labelEl.textContent = labelText;
            if (labelBackEl) labelBackEl.textContent = labelText;

            qEl.textContent = questionText;
            if (isJpQuestion) {
                qEl.classList.add("jp-text");
            } else {
                qEl.classList.remove("jp-text");
            }

            aEl.textContent = answerText;

            const progressEl = document.getElementById('progress');
            if (progressEl) progressEl.textContent = `${currentIndex + 1} / ${currentList.length}`;

            cardEl.classList.remove('flipped');
            isShowingAnswer = false;
        }

        function flipCard() {
            isShowingAnswer = !isShowingAnswer;
            const cardEl = document.getElementById('card');
            cardEl.classList.toggle('flipped', isShowingAnswer);
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex >= currentList.length) {
                currentIndex = 0;
            }
            updateDisplay();
        }

        function prevCard() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = currentList.length - 1;
            }
            updateDisplay();
        }

        let speechPrimed = false;

        function primeSpeechOnce() {
            if (speechPrimed) return false;
            speechPrimed = true;

            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(' ');
                u.lang = 'en-US';
                u.rate = 0.9;
                speechSynthesis.speak(u);
            } catch (e) {
            }
            return true;
        }

        function playAudio(event) {
            if (event && event.stopPropagation) event.stopPropagation();
            if (event && event.currentTarget) event.currentTarget.blur();

            if (currentList.length === 0) {
                showEmptyState();
                return;
            }
            const item = currentList[currentIndex];
            const rawText = (item.en || "").trim();

            if (!rawText) return;

            const didPrime = primeSpeechOnce();

            if (!didPrime) {
                speechSynthesis.cancel();
            }

            const hasParen = /[()]/.test(rawText);
            const baseText = rawText
                .replace(/\([^)]*\)/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
            const fullText = rawText
                .replace(/[()]/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();

            const makeUtterance = (t) => {
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US';
                u.rate = speechRate;
                const voices = speechSynthesis.getVoices();
                const enVoice = voices.find(v => v.lang === 'en-US');
                if (enVoice) u.voice = enVoice;
                return u;
            };

            if (!window.__speakSessionId) window.__speakSessionId = 0;
            const sessionId = ++window.__speakSessionId;

            const speakFull = () => {
                if (window.__speakSessionId !== sessionId) return;
                if (!fullText) return;
                const u2 = makeUtterance(fullText);
                speechSynthesis.speak(u2);
            };

            if (hasParen && baseText && baseText !== fullText) {
                const u1 = makeUtterance(baseText);
                u1.onend = () => {
                    if (window.__speakSessionId !== sessionId) return;
                    setTimeout(speakFull, 1000);
                };
                speechSynthesis.speak(u1);
            } else {
                const u = makeUtterance(fullText || rawText);
                speechSynthesis.speak(u);
            }
        }

        loadWordList();
    </script>

</body>

</html>
